<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício - Linhamento em Tabelas</title>
    <style>
        body{
            font-family:Arial, Arial, Helvetica, sans-serif;
        }
        table{
            width: 400px;
            height: 400px;

            border-collapse: collapse;
        }
        td{
            border: 1px solid black;
            padding: 8px;

            text-align: center;

            vertical-align: middle;
        }
        .numero{
            text-align: right;

            text-align: top;
        }
    </style>
</head>
<body>
    <h1>Exercício - Trabalhando com alinhamento</h1>
    <table>
        <tr>
           <td>A1 <br>(esquedo)</td> 
           <td>B1 <br> (padrão centro)</td>
           <td>C1 <br>(direto) </td>
        </tr>
        <tr class="linha">
            <td>A2 <br>(topo)</td>
            <td>B2 <br> padrão</td>
            <td class="numero">C3 <br>(baixo)</td>
        </tr>
        <td>A4 <br></td>
        <td class="dado">B4 <br></td>
        <td>C4 <br></td>

    </table>
</body>
</html>
